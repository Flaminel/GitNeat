name: spike

on:
  push:
    branches:
      - napi-spike
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addon:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build the addon
        working-directory: rust
        run: cargo build --release -p spike

      - name: Rename the library
        shell: bash
        run: |
          mkdir out
          cp rust/target/release/spike.dll out/spike.node

      - name: Smoke test
        working-directory: out
        run: node -e "console.log(require('./spike.node').hello())"

      - uses: actions/upload-artifact@v4
        with:
          name: spike-windows
          path: out/spike.node
          if-no-files-found: error
