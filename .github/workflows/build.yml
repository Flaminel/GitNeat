name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    if: >-
      github.event_name != 'issue_comment' || (
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/build') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      os: ${{ steps.pick.outputs.os }}
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - id: pick
        env:
          BODY: ${{ github.event.comment.body }}
          PR: ${{ github.event.issue.number }}
        run: |
          first=$(printf '%s\n' "$BODY" | head -n 1 | tr -d '\r')
          case "$first" in
            "/build windows") os='["windows-latest"]' ;;
            "/build mac") os='["macos-latest"]' ;;
            "/build linux") os='["ubuntu-22.04"]' ;;
            *) os='["macos-latest","windows-latest","ubuntu-22.04"]' ;;
          esac
          echo "os=$os" >> "$GITHUB_OUTPUT"
          if [ -n "$PR" ]; then
            echo "ref=refs/pull/$PR/head" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_REF" >> "$GITHUB_OUTPUT"
          fi

      - name: React to the comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=rocket

  tauri:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci
      - run: npm test
        env:
          GITNEAT_RUST_COMPARE: "1"

      - name: Rust checks
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: gitneat-tauri-${{ matrix.os }}
          path: |
            rust/target/release/bundle/dmg/*.dmg
            rust/target/release/bundle/msi/*.msi
            rust/target/release/bundle/nsis/*.exe
            rust/target/release/bundle/appimage/*.AppImage
            rust/target/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist-artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*
