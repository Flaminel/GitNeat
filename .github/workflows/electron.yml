name: electron

on:
  push:
    branches:
      - electron-host
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: npm ci
      - run: npm run typecheck
      - run: npm run electron:build
      - run: npm run addon
      - run: node scripts/bundle.mjs

      - name: Smoke test
        run: node -e "require('./bundle/native/gitneat.node').init(() => {}); process.exit(0)"

      - uses: actions/upload-artifact@v4
        with:
          name: gitneat-electron-${{ matrix.os }}
          path: bundle
          if-no-files-found: error
