[package]
name = "addon"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
gitneat = { path = "../app" }
napi = { version = "2", default-features = false, features = ["napi4", "async", "tokio_rt"] }
napi-derive = "2"
serde_json = "1"

[build-dependencies]
napi-build = "2"
