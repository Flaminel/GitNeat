[package]
name = "repo"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `src/repo.ts`"

[dependencies]
serde = { version = "1", features = ["derive"] }
regex = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
